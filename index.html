<!doctype html>
<html lang="en">
<head>

<title>learning from nature · hello fall</title>
<meta name="description" content="An autumn beech wood seen from the ground. The camera flies up through the canopy into the sky, where it says hello fall.">
<link rel="canonical" href="https://mudranagda.github.io/learning-from-nature/">
<meta property="og:title" content="learning from nature · hello fall">
<meta property="og:description" content="An autumn beech wood seen from the ground. The camera flies up through the canopy into the sky, where it says hello fall.">
<meta property="og:url" content="https://mudranagda.github.io/learning-from-nature/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* One committed visual world: an autumn beech wood seen from the ground.
     No light/dark split; every colour is painted explicitly. */
  :root {
    --sky: #2a7ce0;
    --ink: #2a1d14;
    --paper: #f6ecd9;
    --ui: rgba(255, 255, 255, 0.75); /* text and controls: white on blue, deep sky blue on the wash */
  }
  /* The hero layers are all fixed to the viewport. The page scrolls over a tall
     track: that scroll distance is what turns the sky from blue to white. The
     rest of the site goes in <main class="site">, which slides up over the hero. */
  html.locked, html.locked body { overflow: hidden; } /* no scrolling until the flight has landed */
  body {
    margin: 0;
    background: var(--sky);
    color: var(--paper);
    overflow-x: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    /* the faded-print grade, warm wash, light leak and grain are all applied inside
       the WebGL drawing (see "finishing pass"), not as page layers: stacked
       blend-mode layers over a large canvas were costing more than the forest itself */
  }
  /* loose leaves drifting across the frame once the camera reaches the treetops.
     The canvas sits above the white-out layer and above the words, so leaves keep
     falling over the white and pass in front of the text. */
  .leaf {
    position: fixed;
    inset: 0;
    z-index: 6;               /* over the white site too: the leaves fall the whole length of the page */
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  /* painterly finish: paper grain + a warm vignette pulling the corners in,
     the way the photo's edges fall into shadowed foliage */
  .grain, .wash, .leak, .vignette, .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  /* live film grain: a noise canvas redrawn ~24 times a second */
  .grain {
    width: 100%;
    height: 100%;
    opacity: 0.3;
    /* hard-light, not overlay: overlay does nothing over white, hard-light still
       lets the dark specks through, so the grain carries onto the wash */
    mix-blend-mode: hard-light;
    image-rendering: pixelated; /* keeps coarser grain crisp when its size is turned up */
  }
  /* lifted blacks and a faded amber cast, like an old colour print */
  .wash {
    background: linear-gradient(180deg, rgba(255, 214, 150, 0.16), rgba(255, 190, 120, 0.1));
    mix-blend-mode: screen;
  }
  /* a slow light leak drifting in from one corner */
  .leak {
    background: radial-gradient(ellipse 60% 50% at 88% 10%, rgba(255, 150, 60, 0.42) 0%, rgba(255, 120, 50, 0.12) 40%, rgba(255, 100, 40, 0) 70%);
    mix-blend-mode: screen;
    opacity: 0.55;
    animation: leak 14s ease-in-out infinite alternate;
  }
  @keyframes leak {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-6%, 8%) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    .leak { animation: none; }
  }
  .vignette {
    background: radial-gradient(ellipse 78% 72% at 50% 50%, rgba(60, 30, 10, 0) 55%, rgba(60, 30, 10, 0.42) 100%);
    transition: opacity 1.4s ease;
  }
  .vignette { opacity: var(--vig, 1); }
  .vignette.lift { opacity: 0; }
  /* the white-out at the top of the flight, then the return to the ground */
  .flash {
    background: #fbfaf4;
    opacity: 0;
    transition: opacity 0.4s ease; /* only the fade back out on replay */
  }
  .flash.on { transition: none; } /* while flying, its opacity is driven per frame */
  /* one line of guidance in the centre of the sky */
  .msg {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 0 max(24px, calc(50% - 330px)); /* keeps the longer line to a readable measure */
    text-wrap: balance;
    pointer-events: none;
    font: 400 16px/1.55 'Inter', system-ui, -apple-system, sans-serif;
    letter-spacing: 0.005em;
    color: var(--ui);
    text-align: center;
    opacity: 0;
    transform: scale(0.5);             /* grows from half size into view */
    transition: opacity 2.6s ease, transform 3s cubic-bezier(0.16, 1, 0.3, 1); /* a slow arrival, and a slow return on scrolling back up */
  }
  .msg .sub { display: block; }   /* the second line, same size and weight as the first */
  .msg.show { opacity: 1; transform: scale(1); }
  @media (prefers-reduced-motion: reduce) {
    .msg { transform: none; transition: opacity 1.2s ease; }
  }
  .track { height: 200vh; }  /* the hero's screen plus one more of sky to scroll into, and back up out of */
  .site {
    position: relative;
    z-index: 5;               /* above every fixed hero layer */
    background: none;         /* the sky stays behind the whole page */
    color: rgba(255, 255, 255, 0.92);
    -webkit-user-select: text;
    user-select: text;
  }
  #grainWhite { z-index: 7; }  /* the same grain carries on over the site and the leaves */
  /* work: a short, plain list on the sky; the leaves keep falling over it */
  .work { box-sizing: border-box; max-width: 720px; margin: 0 auto; padding: 18vh max(24px, 6vw) 22vh; }
  .work h2, .work h3 { margin: 0; font: 500 11px/1.4 'Inter', system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; }
  .work ol { list-style: none; margin: 0; padding: 0; }
  .work li { display: grid; grid-template-columns: 9.5em 1fr; gap: 6px 32px; padding: 26px 0; border-top: 0.5px solid rgba(255, 255, 255, 0.16); }
  .work li:last-child { border-bottom: 0.5px solid rgba(255, 255, 255, 0.16); }
  .work a { color: inherit; text-decoration: none; font: 500 13px/1.6 'Inter', system-ui, sans-serif; }
  .work a:hover, .work a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
  .work li a::after { content: '\2197'; margin-left: 5px; font-size: 11px; opacity: 0.55; }
  .work p { margin: 0; font: 400 13px/1.6 'Inter', system-ui, sans-serif; opacity: 0.8; }
  /* the site's few links: a quiet row at the top right, there once the flight has landed */
  .menu {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 8;
    display: flex;
    gap: 26px;
    padding: 22px 28px;
    font: 500 12px/1 'Inter', system-ui, sans-serif;
    color: var(--ui);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }
  .menu a { color: inherit; text-decoration: none; }
  .menu a:hover, .menu a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
  .menu.show { opacity: 1; pointer-events: auto; }
  @media (max-width: 560px) { .work li { grid-template-columns: 1fr; gap: 2px; } }
  /* footer: a raked-up pile of leaves on the ground, and whatever falls onto it */
  .foot { position: relative; min-height: max(78vh, 460px); overflow: hidden; }
  .foot canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* the one link in the footer: X, bottom left, mirroring the sound button on the right */
  .social { position: absolute; left: 20px; bottom: 16px; z-index: 2; color: #02387A; opacity: 0.8; transition: opacity 0.2s ease; }
  .social:hover, .social:focus-visible { opacity: 1; }
  .social svg { display: block; width: 18px; height: 18px; }
  .social:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
  /* small cue that the page continues, shown once the flight has landed */
  .scrollcue {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    padding: 18px 24px;
    line-height: 0;
    color: var(--ui);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .scrollcue svg { display: block; width: 14px; height: 14px; animation: nudge 2.6s ease-in-out infinite; }
  .scrollcue.show { opacity: 0.75; } /* a quarter quieter than the text */
  @keyframes nudge { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
  @media (prefers-reduced-motion: reduce) { .scrollcue svg { animation: none; } }
  /* sound on / off, bottom right; stays above the white site as it scrolls in */
  .sound {
    position: fixed;
    right: 0;
    bottom: 0;
    z-index: 8;
    margin: 0;
    padding: 16px 20px;
    border: 0;
    background: none;
    line-height: 0;
    color: var(--ui);
    cursor: pointer;
  }
  .sound svg { display: block; width: 16px; height: 16px; }
  .sound .waves { transition: opacity 0.3s ease; }
  .sound .slash { opacity: 0; transition: opacity 0.3s ease; }
  .sound.off .waves { opacity: 0; }
  .sound.off .slash { opacity: 1; }
  /* plain text button on the bottom edge, shown once the flight is over */
  .replay {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    padding: 18px 24px;
    border: 0;
    background: none;
    font: 500 12px/1 'Inter', system-ui, -apple-system, sans-serif;
    letter-spacing: 0.01em;
    color: var(--ui);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .replay.show { opacity: 1; pointer-events: auto; }
  .replay:focus-visible, .sound:focus-visible, .zoom input:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }
  /* camera height: a hairline on the right edge with snapped stops */
  .zoom {
    position: fixed;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: stretch;
    gap: 8px;
    height: 150px;
    color: var(--ui);
    font: 500 10px/1 'Inter', system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .zoom ol {
    list-style: none;
    margin: 0;
    padding: 1px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: right;
    opacity: 0.8;
  }
  .zoom[hidden] { display: none; }
  .zoom.off { opacity: 0.35; pointer-events: none; }
  .zoom { transition: opacity 0.4s ease; }
  .zoom input {
    -webkit-appearance: none;
    appearance: none;
    writing-mode: vertical-lr;
    direction: rtl;
    width: 14px;
    height: 100%;
    margin: 0;
    padding: 0;
    color: inherit;
    background: linear-gradient(currentColor, currentColor) center / 1px 100% no-repeat;
    cursor: pointer;
  }
  .zoom input::-webkit-slider-runnable-track { background: transparent; }
  .zoom input::-moz-range-track { background: transparent; }
  .zoom input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentColor;
    border: 0;
  }
  .zoom input::-moz-range-thumb {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentColor;
    border: 0;
  }

</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="vignette"></div>
<div class="flash" id="flash"></div>
<p class="msg" id="msg"></p>
<canvas class="leaf" id="leaf"></canvas>
<div class="grain" id="grainWhite" style="mix-blend-mode: normal; opacity: 0; display: none" aria-hidden="true"></div>
<p class="scrollcue" id="scrollcue" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.5v11M2.5 8 7 12.5 11.5 8"/></svg></p>
<button class="replay" id="replay" type="button">replay</button>
<nav class="menu" id="menu" aria-label="Site"></nav>
<button class="sound off" id="sound" type="button" aria-label="Sound" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6v4h2.5L8 13V3L4.5 6H2z" fill="currentColor" stroke-width="1"/><g class="waves"><path d="M10.5 5.8a3 3 0 0 1 0 4.4"/><path d="M12.4 3.9a5.7 5.7 0 0 1 0 8.2"/></g><path class="slash" d="M10.6 6 14.4 10M14.4 6 10.6 10"/></svg></button>
<!-- the height slider is hidden for now: remove the "hidden" attribute to bring it back -->
<label class="zoom" id="zoom" hidden aria-label="Camera height, as a percentage of tree height">
  <ol aria-hidden="true"><li>125</li><li>100</li><li>75</li><li>50</li><li>25</li><li>0</li></ol>
  <input id="zoomRange" type="range" min="0" max="125" step="1" value="50" aria-valuetext="50%">
</label>

<div class="track" aria-hidden="true"></div>
<!-- The rest of the site (projects, case studies) goes here. It sits on the same
     white the sky turns into, and scrolls up over the hero. -->
<main class="site" id="site"></main>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js';
const BOOT = (window.__boot = { start: performance.now() });   // how long each stage of starting up takes

// ---------------------------------------------------------------------------
// A beech wood in October, seen lying on the ground: pale trunks converge on
// the zenith through a wide lens, the crowns are painted as dabs of
// yellow-green, amber and flame, and two dark spruces crowd the edge of the
// frame. A click fires the viewer straight up the trunk line, through the
// canopy, into open blue.
// ---------------------------------------------------------------------------

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- tunable parameters -------------------------------------------------------
// The shipped look. Open the page with #dials in the address for a panel of
// sliders over these; nothing here changes unless that panel is open.
const DEFAULTS = {
  // grain
  grainOpacity: 0.3, grainFlicker: 0, grainSize: 1.5, grainContrast: 135, grainFps: 29, grainBlend: 'soft-light',
  // faded print
  saturate: 1.02, contrast: 0.98, sepia: 0.06, brightness: 0.98, wash: 0.3, leak: 0.4, vignette: 0.42,
  // movement
  wind: 1, windSpeed: 1, flight: (reduceMotion ? 4.6 : 6.4) / 1.2, spiral: 0.5, tighten: 22, drift: 1, clouds: 2,
  // loose leaves
  leafCount: 5, leafFall: 1, leafSway: 1.7, leafSize: 1,
  // scroll
  scrollVh: 100,
};
const P = { ...DEFAULTS };

// deterministic rng so the wood is the same wood on every visit
function mulberry(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry(20261012);
const rr = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];

// ---- palette (sRGB, converted to linear by THREE.Color) --------------------
const SKY_ZENITH = new THREE.Color('#1f6fd8');
const SKY_HORIZON = new THREE.Color('#5aa0ee');
// The wash colours are blended on screen, after tone mapping, so the sky can
// actually arrive at the page's white. (Tone mapping holds a lit white down to a
// light grey, which is what made the old hand-over to the white layer visible.)
// convertLinearToSRGB leaves these holding plain screen values.
const SKY_PALE = new THREE.Color('#8fbdeb').convertLinearToSRGB();  // the blue simply grows lighter first
const SUN_GLOW = new THREE.Color('#f6eed8').convertLinearToSRGB();  // then the faintest warmth
const SKY_WHITE = new THREE.Color('#fdfcf7').convertLinearToSRGB(); // and white
const FOG = new THREE.Color('#3f8ce6');
const SUN_DIR = new THREE.Vector3(-0.62, 0.66, -0.42).normalize();

// leaf families: A and B are the two hues each dab blends between
const FAMILIES = {
  // each tree keeps to one colour, the way the reference has a pink tree, a white
  // one, a lime one, a green one, an orange maple and a golden one
  gold:  ['#e9ab1a', '#f0c63a'],   // golden yellow
  amber: ['#b3cd2c', '#d3e058'],   // lime, backlit yellow-green
  flame: ['#d94a14', '#bd2a12'],   // maple orange into red
  ember: ['#e994a9', '#f1bac6'],   // blossom pink
  olive: ['#5c9d31', '#8fc03c'],   // fresh green
  lime:  ['#ece5d4', '#f5f0e4'],   // white
  spruce: ['#4d8a38', '#6ea742'],
};

// ---- renderer / scene ------------------------------------------------------
const canvas = document.getElementById('stage');
// no antialiasing on the canvas itself: it only ever receives one full-screen picture
// from the finishing pass. The forest is antialiased in its own buffer (see below).
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
// for testing only: ?pr=3 forces the canvas resolution, ?scale=0.7 the scene's share of it,
// ?h=10 the starting height in percent, ?u=0.4 holds the flight at that point
const QS = new URLSearchParams(location.search);
const PR_FORCED = Number(QS.get('pr')) || 0;
const CANVAS_PR = PR_FORCED || Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(CANVAS_PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG, 34, 150);

const camera = new THREE.PerspectiveCamera(96, 1, 0.05, 600);
const GROUND_Y = 10; // start about a quarter of the way up the trunks
camera.position.set(0, GROUND_Y, 0); // moved to the 50% start once the tree height is known

// light: a low warm sun off to the upper left, cool sky fill, warm bounce
scene.add(new THREE.HemisphereLight(new THREE.Color('#b3d0ef'), new THREE.Color('#8a6a4a'), 1.6));
const sun = new THREE.DirectionalLight(new THREE.Color('#ffe9c9'), 2.2);
sun.position.copy(SUN_DIR).multiplyScalar(100);
scene.add(sun);

// ---- sky dome --------------------------------------------------------------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uZenith: { value: SKY_ZENITH },
      uHorizon: { value: SKY_HORIZON },
      uPale: { value: SKY_PALE },
      uGlow: { value: SUN_GLOW },
      uWhite: { value: SKY_WHITE },
      uSun: { value: SUN_DIR },
      uLift: { value: 0 },  // 0..1, how far the light has opened
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uZenith, uHorizon, uPale, uGlow, uWhite, uSun; uniform float uLift;
      varying vec3 vDir;
      void main() {
        float h = clamp(vDir.y, 0.0, 1.0);
        vec3 col = mix(uHorizon, uZenith, pow(h, 0.65));
        // the sun, up to the right: a wide warm haze and a tighter bright core
        float d = max(dot(normalize(vDir), uSun), 0.0);
        col += vec3(1.0, 0.93, 0.78) * (0.16 * pow(d, 14.0) + 0.45 * pow(d, 260.0)) * (1.0 - uLift);
        // The whole sky brightens together, with no edge anywhere. It stays in its
        // own hue as it lightens (blue to pale blue), and only near the end picks up
        // a trace of warmth before settling on white, so it never passes through
        // the grey-green that a straight blue-to-yellow blend makes.
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        vec3 o = gl_FragColor.rgb;
        o = mix(o, uPale, smoothstep(0.0, 0.55, uLift));
        o = mix(o, uGlow, smoothstep(0.35, 0.85, uLift));
        o = mix(o, uWhite, smoothstep(0.7, 1.0, uLift));
        gl_FragColor.rgb = o;
      }`,
  }),
);
sky.renderOrder = 1;
scene.add(sky);

// ---- bark texture: dark brown, mottled, a little lichen ---------------------
function barkTexture() {
  const W = 256, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7d5d45';
  ctx.fillRect(0, 0, W, H);
  const r = mulberry(77);
  const blot = (color, n, rx, ry, alpha) => {
    ctx.fillStyle = color;
    for (let i = 0; i < n; i++) {
      ctx.globalAlpha = alpha * (0.5 + r());
      ctx.beginPath();
      ctx.ellipse(r() * W, r() * H, rx * (0.4 + r()), ry * (0.4 + r()), r() * 6.3, 0, 6.3);
      ctx.fill();
    }
  };
  blot('#9c7b5e', 200, 30, 48, 0.26);   // warmer patches
  blot('#4a372a', 180, 24, 40, 0.2);    // deep shadows
  blot('#5e5a3a', 70, 16, 22, 0.14);    // lichen
  blot('#241a12', 220, 10, 2, 0.18);    // lenticel scratches, horizontal
  blot('#3a2b1f', 40, 3, 90, 0.14);     // faint vertical seams
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

// ---- leaf dab atlas ----------------------------------------------------------
// 2x2 atlas of painterly "dabs": each cell is 3-5 overlapping leaf shapes.
// R channel = which of the two family hues this leaf takes, G = luminance
// shading, A = coverage with a softened, slightly ragged edge.
function dabAtlas() {
  const S = 512, CELL = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  const r = mulberry(4242);
  const leaf = (cx, cy, ang, len, wid, hue, lum) => {
    // pointed ellipse with a jittered outline
    const pts = [];
    const n = 22;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      const ex = Math.cos(a) * len;
      const ey = Math.sin(a) * wid * (0.75 + 0.25 * Math.abs(Math.cos(a)));
      const j = 1 + (r() - 0.5) * 0.16;
      pts.push([
        cx + (ex * Math.cos(ang) - ey * Math.sin(ang)) * j,
        cy + (ex * Math.sin(ang) + ey * Math.cos(ang)) * j,
      ]);
    }
    const g = ctx.createLinearGradient(
      cx - Math.cos(ang) * len, cy - Math.sin(ang) * len,
      cx + Math.cos(ang) * len, cy + Math.sin(ang) * len,
    );
    const hueByte = Math.round(hue * 255);
    g.addColorStop(0, `rgb(${hueByte},${Math.round(lum * 0.72 * 255)},0)`);
    g.addColorStop(1, `rgb(${hueByte},${Math.round(lum * 255)},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < n; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    ctx.fill();
    // shadowed rim so each leaf keeps its outline where dabs overlap
    ctx.strokeStyle = `rgb(${hueByte},${Math.round(lum * 0.42 * 255)},0)`;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.stroke();
  };
  for (let cell = 0; cell < 4; cell++) {
    const ox = (cell % 2) * CELL, oy = Math.floor(cell / 2) * CELL;
    const count = 3 + Math.floor(r() * 3);
    for (let i = 0; i < count; i++) {
      leaf(
        ox + CELL / 2 + (r() - 0.5) * 90,
        oy + CELL / 2 + (r() - 0.5) * 90,
        r() * Math.PI,
        44 + r() * 30,
        22 + r() * 14,
        r(),
        0.32 + r() * 0.68,
      );
    }
  }
  // soften edges a touch so the alpha cutout reads like a wet brush edge
  const soft = document.createElement('canvas');
  soft.width = S; soft.height = S;
  const sctx = soft.getContext('2d');
  sctx.filter = 'blur(1.2px)';
  sctx.drawImage(c, 0, 0);
  const tex = new THREE.CanvasTexture(soft);
  tex.colorSpace = THREE.NoColorSpace;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

// ---- geometry builders ----------------------------------------------------
// One merged buffer per tree for branches; one global buffer for twig lines;
// one global instanced buffer for every leaf dab in the wood.
class TubeBuilder {
  constructor() { this.pos = []; this.nor = []; this.uv = []; this.idx = []; this.count = 0; }
  // path: [{p: Vector3, r: number}], sides: ring resolution
  addPath(path, sides) {
    const base = this.count;
    let N = new THREE.Vector3();
    let arc = 0;
    const T = new THREE.Vector3(), B = new THREE.Vector3(), tmp = new THREE.Vector3();
    for (let i = 0; i < path.length; i++) {
      const p = path[i].p;
      const next = path[Math.min(i + 1, path.length - 1)].p;
      const prev = path[Math.max(i - 1, 0)].p;
      T.subVectors(next, prev).normalize();
      if (i === 0) {
        tmp.set(1, 0, 0);
        if (Math.abs(T.dot(tmp)) > 0.9) tmp.set(0, 0, 1);
        N.crossVectors(T, tmp).normalize();
      } else {
        arc += p.distanceTo(prev);
        // parallel-transport the frame so the tube doesn't twist
        N.sub(tmp.copy(T).multiplyScalar(N.dot(T))).normalize();
      }
      B.crossVectors(T, N);
      const rad = path[i].r;
      for (let j = 0; j <= sides; j++) {
        const a = (j / sides) * Math.PI * 2;
        const nx = N.x * Math.cos(a) + B.x * Math.sin(a);
        const ny = N.y * Math.cos(a) + B.y * Math.sin(a);
        const nz = N.z * Math.cos(a) + B.z * Math.sin(a);
        this.pos.push(p.x + nx * rad, p.y + ny * rad, p.z + nz * rad);
        this.nor.push(nx, ny, nz);
        this.uv.push(j / sides, arc / 2.4);
      }
    }
    const ring = sides + 1;
    for (let i = 0; i < path.length - 1; i++) {
      for (let j = 0; j < sides; j++) {
        const a = base + i * ring + j, b = a + 1, c = a + ring, d = c + 1;
        this.idx.push(a, c, b, b, c, d);
      }
    }
    this.count += path.length * ring;
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setIndex(this.idx);
    return g;
  }
}

const twigPos = [];
const leaves = { pos: [], quat: [], scale: [], colA: [], colB: [], misc: [] };
const tmpQ = new THREE.Quaternion(), tmpQ2 = new THREE.Quaternion();
const Z = new THREE.Vector3(0, 0, 1), Y = new THREE.Vector3(0, 1, 0);
const familyColors = {};
for (const [k, [a, b]] of Object.entries(FAMILIES)) familyColors[k] = [new THREE.Color(a), new THREE.Color(b)];

const WINDOW = QS.has('win') ? Number(QS.get('win')) : 0.45; // ?win=0.6 tries a wider opening, for tuning
const CORE = QS.has('core') ? Number(QS.get('core')) : 0.28;    // the part of it that stays open through the flight
const EYE = 29;   // where the viewer rests, about halfway up the trunks (heightFor(0.5), known only once the wood is grown)
function addDab(p, family, scale) {
  // keep a window of sky open straight overhead. Most leaves inside that cone
  // are "flight-only": scaled to nothing while the viewer lies on the ground,
  // grown in once the camera lifts, so the ascent still pushes through foliage.
  let flightOnly = 0;
  const off = Math.hypot(p.x, p.z);
  if (off < p.y * 0.2) {
    // the original window. Its early return and its one random draw are kept
    // exactly as they were, so the seeded wood grows identically.
    if (p.y < 18) return;
    if (p.y < 22 || rnd() < 0.75) flightOnly = 1;
  }
  // The window proper is measured from the eye, not from the ground: the viewer
  // rests about 29 units up the trunks, and a window cut from the ground looks,
  // from up there, like leaves spread right across the middle of the picture.
  // No random draws here, so nothing downstream shifts.
  const up = p.y - EYE;
  if (up > 0.5) {
    // the opening: a heart (point toward the bottom of the screen, lobes toward
    // the top). Most of a heart's area is up in its lobes, so it is tested 0.3
    // higher than drawn: that puts the open sky's centre at the centre of the
    // screen rather than above it. These dabs grow in once the flight is under way.
    const u = -p.x / (up * WINDOW), v = -p.z / (up * WINDOW) + 0.3, q = u * u + v * v - 1;
    if (q * q * q - u * u * v * v * v < 0) flightOnly = 1;
    // its core never fills in, so the opening stays in the centre of the picture
    // as the camera climbs through the rest of the canopy
    if (off < up * CORE) flightOnly = 2;
  }
  // face mostly downward/upward (seen from below), random tilt and spin
  const tilt = rnd() < 0.65 ? rr(0, 0.7) : rr(0.7, 1.5);
  const az = rr(0, Math.PI * 2);
  const normal = new THREE.Vector3(Math.sin(tilt) * Math.cos(az), Math.cos(tilt), Math.sin(tilt) * Math.sin(az));
  tmpQ.setFromUnitVectors(Z, normal);
  tmpQ2.setFromAxisAngle(Z, rr(0, Math.PI * 2));
  tmpQ.multiply(tmpQ2);
  const [a, b] = familyColors[family];
  const jitter = rr(0.82, 1.18);
  leaves.pos.push(p.x, p.y, p.z);
  leaves.quat.push(tmpQ.x, tmpQ.y, tmpQ.z, tmpQ.w);
  leaves.scale.push(scale);
  leaves.colA.push(a.r * jitter, a.g * jitter, a.b * jitter);
  leaves.colB.push(b.r * jitter, b.g * jitter, b.b * jitter);
  leaves.misc.push(rr(0, Math.PI * 2), Math.floor(rnd() * 4), flightOnly, rr(0.55, 1.15));
}

// perturb a direction by a random vector, keep unit length
const _v = new THREE.Vector3();
function wobble(dir, amount, upBias) {
  _v.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(amount);
  dir.add(_v).addScaledVector(Y, upBias).normalize();
  return dir;
}
function perpendicular(dir) {
  _v.set(rr(-1, 1), rr(-1, 1), rr(-1, 1));
  return _v.sub(dir.clone().multiplyScalar(_v.dot(dir))).normalize().clone();
}

// A crown branch: curved tube, children at the tip and along the outer half,
// leaf dabs along everything from lod.leafDepth outward.
function growBranch(tb, start, dir, len, r0, r1, depth, lod, family) {
  const segs = 4;
  const path = [{ p: start.clone(), r: r0 }];
  const d = dir.clone();
  let p = start.clone();
  for (let i = 1; i <= segs; i++) {
    wobble(d, 0.16, 0.05);
    p = p.clone().addScaledVector(d, len / segs);
    path.push({ p, r: r0 + (r1 - r0) * (i / segs) });
  }
  if (depth < lod.maxDepth) tb.addPath(path, Math.max(3, 7 - depth * 2));
  else for (let i = 0; i < segs; i++) twigPos.push(path[i].p.x, path[i].p.y, path[i].p.z, path[i + 1].p.x, path[i + 1].p.y, path[i + 1].p.z);

  if (depth >= lod.leafDepth) {
    const step = lod.leafStep;
    for (let s = step * 0.5; s < len; s += step) {
      const i = Math.min(segs - 1, Math.floor((s / len) * segs));
      const t = (s / len) * segs - i;
      const c = path[i].p.clone().lerp(path[i + 1].p, t);
      const n = lod.dabsPerCluster;
      for (let k = 0; k < n; k++) {
        const q = c.clone().add(new THREE.Vector3(rr(-1, 1), rr(-0.6, 0.6), rr(-1, 1)).multiplyScalar(lod.spread));
        addDab(q, family, rr(0.38, 0.72) * lod.dabScale);
      }
    }
  }
  if (depth >= lod.maxDepth) return;
  const kids = 2 + (rnd() < 0.55 ? 1 : 0);
  for (let k = 0; k < kids; k++) {
    const at = k === 0 ? 1 : rr(0.55, 0.95);
    const i = Math.min(segs - 1, Math.floor(at * segs));
    const t = at * segs - i;
    const origin = path[i].p.clone().lerp(path[i + 1].p, t);
    const axis = perpendicular(d);
    const cd = d.clone().applyAxisAngle(axis, k === 0 ? rr(0.15, 0.4) : rr(0.5, 0.95));
    cd.addScaledVector(Y, 0.25).normalize();
    const cr0 = r0 + (r1 - r0) * at;
    growBranch(tb, origin, cd, len * rr(0.58, 0.74), cr0 * 0.9, cr0 * 0.42, depth + 1, lod, family);
  }
}

function beech(tree) {
  const tb = new TubeBuilder();
  const { x, z, height: H, baseR, lean, family, lod } = tree;
  // trunk: near-vertical with a gentle lean and slight waver
  const path = [];
  const d = new THREE.Vector3(lean.x, 1, lean.z).normalize();
  let p = new THREE.Vector3(x, -0.5, z);
  const segs = 14;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const r = baseR * Math.pow(1 - t, 0.85) + 0.03;
    path.push({ p: p.clone(), r });
    wobble(d, 0.05, 0.02);
    p = p.clone().addScaledVector(d, H / segs);
  }
  tb.addPath(path, 10);
  // crown: branches leave the trunk from ~45% up, rising and spreading
  const crownStart = 0.42 + rnd() * 0.1;
  const nBranches = lod.branches;
  for (let i = 0; i < nBranches; i++) {
    const t = crownStart + (1 - crownStart) * ((i + rnd() * 0.8) / nBranches);
    const seg = Math.min(segs - 1, Math.floor(t * segs));
    const origin = path[seg].p.clone().lerp(path[seg + 1].p, t * segs - seg);
    const trunkDir = path[seg + 1].p.clone().sub(path[seg].p).normalize();
    const axis = perpendicular(trunkDir);
    // steeper branches near the top, spreading ones lower down
    const ang = rr(0.55, 1.1) * (1 - (t - crownStart) * 0.5);
    const bd = trunkDir.clone().applyAxisAngle(axis, ang);
    bd.add(new THREE.Vector3(x, 0, z).normalize().multiplyScalar(0.45)).normalize(); // crowns open outward
    const len = H * rr(0.2, 0.3) * (1 - (t - crownStart) * 0.35);
    const r = path[seg].r;
    growBranch(tb, origin, bd, len, r * 0.55, r * 0.22, 1, lod, family);
  }
  const g = tb.build();
  return g;
}

// A spruce: straight trunk, whorls of drooping branches, dark dense dabs.
function spruce(tree) {
  const tb = new TubeBuilder();
  const { x, z, height: H, baseR, lod } = tree;
  const path = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    path.push({ p: new THREE.Vector3(x + rr(-0.05, 0.05), -0.5 + H * t, z + rr(-0.05, 0.05)), r: baseR * (1 - t) + 0.03 });
  }
  tb.addPath(path, 8);
  for (let y = H * 0.25; y < H * 0.97; y += 0.9) {
    const n = 4 + Math.floor(rnd() * 3);
    const reach = (1 - y / H) * H * 0.22 + 0.4;
    for (let k = 0; k < n; k++) {
      const a = rr(0, Math.PI * 2);
      const dir = new THREE.Vector3(Math.cos(a), -0.28, Math.sin(a)).normalize();
      const start = new THREE.Vector3(x, y, z);
      const bp = [{ p: start, r: 0.06 }];
      let q = start.clone();
      for (let i = 1; i <= 3; i++) {
        q = q.clone().addScaledVector(dir, reach / 3);
        q.y -= 0.05 * i;
        bp.push({ p: q.clone(), r: 0.06 * (1 - i / 3) + 0.01 });
        for (let m = 0; m < lod.dabsPerCluster; m++) {
          addDab(q.clone().add(new THREE.Vector3(rr(-1, 1), rr(-0.7, 0.3), rr(-1, 1)).multiplyScalar(0.45)), 'spruce', rr(0.4, 0.7) * lod.dabScale);
        }
      }
      tb.addPath(bp, 4);
    }
  }
  return tb.build();
}

// ---- the wood -------------------------------------------------------------
const LOD = {
  near: { maxDepth: 4, leafDepth: 2, leafStep: 0.4, dabsPerCluster: 4, spread: 0.6, dabScale: 0.9, branches: 11 },
  mid:  { maxDepth: 3, leafDepth: 2, leafStep: 0.5, dabsPerCluster: 4, spread: 0.7, dabScale: 1.4, branches: 10 },
  far:  { maxDepth: 3, leafDepth: 1, leafStep: 0.8, dabsPerCluster: 3, spread: 0.9, dabScale: 2.2, branches: 8 },
};
const barkMat = new THREE.MeshLambertMaterial({ map: barkTexture(), color: new THREE.Color('#fbeadb') });
const trees = [];
function ring(count, r0, r1, lod, families, hMin, hMax) {
  for (let i = 0; i < count; i++) {
    const a = ((i + rr(0.1, 0.9)) / count) * Math.PI * 2;
    const r = rr(r0, r1);
    const out = rr(0.06, 0.16) * (lod === LOD.near ? 1.3 : 1);
    trees.push({
      x: Math.cos(a) * r, z: Math.sin(a) * r,
      height: rr(hMin, hMax), baseR: rr(0.18, 0.32),
      lean: { x: Math.cos(a) * out + rr(-0.04, 0.04), z: Math.sin(a) * out + rr(-0.04, 0.04) },
      family: pick(families), lod, kind: 'beech',
    });
  }
}
// the dominant near trunk that runs up the middle of the frame
trees.push({ x: 0.9, z: 2.4, height: 34, baseR: 0.34, lean: { x: 0.06, z: 0.16 }, family: 'amber', lod: LOD.near, kind: 'beech' });
ring(6, 2.8, 6.5, LOD.near, ['gold', 'amber', 'flame', 'olive', 'ember', 'lime'], 26, 36);
ring(9, 7, 14, LOD.mid, ['amber', 'gold', 'flame', 'olive', 'ember', 'gold', 'lime'], 24, 34);
ring(16, 15, 30, LOD.far, ['amber', 'flame', 'gold', 'olive', 'ember'], 22, 32);
// one spruce at the frame's edge, like the photo's bottom-right corner
trees.push({ x: 12.5, z: 11, height: 24, baseR: 0.26, lod: { dabsPerCluster: 3, dabScale: 0.9 }, kind: 'spruce' });

const wood = new THREE.Group();
for (const t of trees) {
  const g = t.kind === 'spruce' ? spruce(t) : beech(t);
  const m = new THREE.Mesh(g, barkMat);
  m.frustumCulled = false;
  wood.add(m);
}
scene.add(wood);

// twigs: the finest reaching lines, dark against the sky
const twigGeo = new THREE.BufferGeometry();
twigGeo.setAttribute('position', new THREE.Float32BufferAttribute(twigPos, 3));
const twigs = new THREE.LineSegments(twigGeo, new THREE.LineBasicMaterial({ color: new THREE.Color('#4a3424'), fog: true }));
twigs.frustumCulled = false;
scene.add(twigs);

// Draw order: nearest first. The camera only ever looks straight up, so nearest
// simply means lowest. Drawn in that order, a leaf already on screen lets the GPU
// skip the ones hidden behind it, instead of painting every layer of the canopy.
// The picture is identical; only the order of drawing changes.
{
  const n = leaves.scale.length;
  const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => leaves.pos[a * 3 + 1] - leaves.pos[b * 3 + 1]);
  const take = (arr, k) => { const out = new Array(n * k); for (let i = 0; i < n; i++) for (let j = 0; j < k; j++) out[i * k + j] = arr[order[i] * k + j]; return out; };
  leaves.pos = take(leaves.pos, 3); leaves.quat = take(leaves.quat, 4); leaves.scale = take(leaves.scale, 1);
  leaves.colA = take(leaves.colA, 3); leaves.colB = take(leaves.colB, 3); leaves.misc = take(leaves.misc, 4);
}
// leaves: one instanced draw call for the whole canopy
const plane = new THREE.PlaneGeometry(1, 1);
const leafGeo = new THREE.InstancedBufferGeometry();
leafGeo.index = plane.index;
leafGeo.setAttribute('position', plane.attributes.position);
leafGeo.setAttribute('uv', plane.attributes.uv);
leafGeo.setAttribute('iPos', new THREE.InstancedBufferAttribute(new Float32Array(leaves.pos), 3));
leafGeo.setAttribute('iQuat', new THREE.InstancedBufferAttribute(new Float32Array(leaves.quat), 4));
leafGeo.setAttribute('iScale', new THREE.InstancedBufferAttribute(new Float32Array(leaves.scale), 1));
leafGeo.setAttribute('iColA', new THREE.InstancedBufferAttribute(new Float32Array(leaves.colA), 3));
leafGeo.setAttribute('iColB', new THREE.InstancedBufferAttribute(new Float32Array(leaves.colB), 3));
leafGeo.setAttribute('iMisc', new THREE.InstancedBufferAttribute(new Float32Array(leaves.misc), 4));
leafGeo.instanceCount = leaves.scale.length;
console.info('beech ascent: leaf dabs', leaves.scale.length, 'twig segments', twigPos.length / 6);

const leafMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: {
    uMap: { value: dabAtlas() },
    uTime: { value: 0 },
    uWind: { value: reduceMotion ? 0 : 1 },
    uFogColor: { value: FOG },
    uFogRange: { value: new THREE.Vector2(34, 150) },
    uSun: { value: SUN_DIR },
    uGrow: { value: new THREE.Vector2(26, 34) }, // camera heights between which the flight-only dabs grow in; reset once the resting height is known
  },
  vertexShader: `
    attribute vec3 iPos; attribute vec4 iQuat; attribute float iScale;
    attribute vec3 iColA; attribute vec3 iColB; attribute vec4 iMisc;
    uniform float uTime, uWind; uniform vec2 uFogRange, uGrow; uniform vec3 uSun;
    varying vec2 vUv; varying vec3 vColA, vColB; varying float vFog, vNear, vShade;
    vec3 qrot(vec4 q, vec3 v) { return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v); }
    void main() {
      float phase = iMisc.x;
      vUv = (uv + vec2(mod(iMisc.y, 2.0), floor(iMisc.y / 2.0))) * 0.5;
      // flutter: each dab rocks on its stem
      float f = (sin(uTime * 0.9 + phase) * 0.22 + sin(uTime * 0.33 + phase * 1.7) * 0.14) * uWind;
      float show = iMisc.z > 1.5 ? 0.0 : iMisc.z > 0.5 ? smoothstep(uGrow.x, uGrow.y, cameraPosition.y) : 1.0;
      vec3 p = position * iScale * show;
      float c = cos(f), s = sin(f);
      p = vec3(p.x, p.y * c - p.z * s, p.y * s + p.z * c);
      vec3 world = iPos + qrot(iQuat, p);
      // the whole crown breathes in the wind, more so higher up
      float sway = 0.08 + 0.16 * clamp(world.y / 30.0, 0.0, 1.0);
      float gust = 0.7 + 0.3 * sin(uTime * 0.21 + world.x * 0.05);
      world.xz += vec2(sin(uTime * 0.45 + phase), cos(uTime * 0.34 + phase * 0.7)) * sway * gust * uWind;
      float dist = length(world - cameraPosition);
      vFog = smoothstep(uFogRange.x, uFogRange.y, dist);
      vNear = smoothstep(0.12, 0.8, dist);
      // backlight: thin leaves against the sun glow, brighter toward the top
      vec3 n = normalize(qrot(iQuat, vec3(0.0, 0.0, 1.0)));
      float back = abs(dot(n, uSun));
      float toSun = 0.5 + 0.5 * dot(normalize(world - cameraPosition), uSun);   // the side of the sky the sun is on
      vShade = (0.42 + 0.4 * clamp(world.y / 34.0, 0.0, 1.0) + 0.25 * back + 0.15 * toSun) * iMisc.w;
      vColA = iColA; vColB = iColB;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(world, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D uMap; uniform vec3 uFogColor;
    varying vec2 vUv; varying vec3 vColA, vColB; varying float vFog, vNear, vShade;
    void main() {
      vec4 t = texture2D(uMap, vUv);
      float a = t.a * vNear;
      if (a < mix(0.42, 0.18, vFog)) discard;
      vec3 col = mix(vColA, vColB, t.r) * (0.2 + 1.0 * t.g) * vShade;
      col = mix(col, uFogColor, vFog * 0.85);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const canopy = new THREE.Mesh(leafGeo, leafMat);
canopy.frustumCulled = false;
scene.add(canopy);

// ---- clouds: three loose drifts of cotton fluff the flight passes through --
function puffTexture() {
  const S = 128;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const r = mulberry(5);
  // several soft blobs offset from centre, so a puff is lumpy rather than round
  for (let i = 0; i < 7; i++) {
    const cx = S / 2 + (r() - 0.5) * S * 0.36;
    const cy = S / 2 + (r() - 0.5) * S * 0.36;
    const rad = S * (0.18 + r() * 0.22);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, 'rgba(255,255,255,0.32)');
    g.addColorStop(0.45, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const puffTex = puffTexture();
const clouds = new THREE.Group();
scene.add(clouds);
const puffs = [];
// [height, x, z, scale]: spread across the sky above the treetops, visible
// through the canopy from the ground. One sits right over the flight line and

  music.fadedOnce = true;

    const g = ctx.createGain();

    g.gain.exponentialRampToValueAtTime(vel, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 2.4);

// ---- finishing pass -----------------------------------------------------------
// The forest is drawn into a buffer of its own, and then one full-screen shader

// These used to be separate page layers with blend modes; on a big window the

// The forest's buffer is smaller than the canvas and is stretched to it here. The
// cost of the forest is almost entirely the number of pixels it covers, so on a

const postMat = new THREE.ShaderMaterial({

    uGrade: { value: new THREE.Vector4(1, 1, 0, 1) },    // saturate, contrast, sepia, brightness
    uWash: { value: 0 }, uLeak: { value: 0 }, uLeakE: { value: 0 },

// ---- dials ---------------------------------------------------------------------
// A tuning panel, only built when the address ends in #dials. Every row is a
// slider you drag across; values persist in this browser until Reset. Nothing

applyLook();
if (location.hash.includes('dials')) {

      ['grainSize', 'speck size', 1, 5, 0.5, () => { sizeGrain(); drawGrain(); }],

    ['Faded print', [
      ['saturate', 'saturation', 0, 1.5, 0.01],
      ['contrast', 'contrast', 0.5, 1.5, 0.01],
      ['sepia', 'sepia', 0, 1, 0.01],
      ['brightness', 'brightness', 0.6, 1.4, 0.01],
      ['wash', 'amber wash', 0, 2, 0.01],
      ['leak', 'light leak', 0, 1, 0.01],

      ['spiral', 'spiral', 0, 2, 0.01],
      ['tighten', 'lens tighten', 0, 50, 1],
      ['drift', 'idle drift', 0, 6, 0.1],
      ['clouds', 'clouds', 0, 3, 0.05],

    ['Loose leaves', [
      ['leafCount', 'how many', 0, 30, 1],
      ['leafFall', 'fall speed', 0.2, 4, 0.05],

  const css = document.createElement('style');

    .dk { position: fixed; top: 14px; left: 14px; z-index: 60; width: 264px; max-height: calc(100vh - 28px); overflow: auto; overscroll-behavior: contain;
